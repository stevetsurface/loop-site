<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Loop Personal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"><style>
/* Loop 2.0 design system. Evolution of loophealth.id: teal stays the identity, lavender becomes a mint-tinted ground,
   deep navy-teal for dark bands and primary buttons, bigger display type, 24px cards. Light-only. */
:root{--bg:#fff;--mint:#f2f9f8;--sand:#fbfaf8;--ink:#14202b;--ink2:#2b3a48;--body:#4f5d6a;--muted:#8593a0;--line:#e6ecec;
--teal:#2fb8ab;--teal-deep:#137f78;--teal-soft:#e3f6f3;--navy:#0f2a3a;--navy-2:#163b50;--amber:#f4b942;--amber-soft:#fff4d6;--wa:#25d366;
--ok:#2a9d6f;--ok-soft:#dff3ea;--warn:#d99a00;--warn-soft:#fff3cf;--bad:#d9534f;--bad-soft:#fde3e2;--font:'Plus Jakarta Sans',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--body);font-family:var(--font);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:0}
.wrap{max-width:1120px;margin:0 auto}.bleed{margin-inline:-16px;padding-inline:16px}
a{color:var(--teal-deep)}
.nav{height:84px;display:flex;align-items:center;justify-content:space-between;gap:16px}.nav img{width:84px;height:39px;display:block}
.nav .links{display:flex;gap:22px;align-items:center}.nav .links a{color:var(--ink2);text-decoration:none;font-size:15px;font-weight:600}.nav .links a.on{color:var(--teal-deep)}.nav .links a.btn{color:#fff}
@media (max-width:900px){.nav .links a:not(.btn){display:none}}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}.lang button{font:inherit;font-size:12.5px;font-weight:700;padding:6px 11px;border:0;background:#fff;color:var(--muted);cursor:pointer}.lang button[aria-pressed="true"]{background:var(--navy);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 24px;border-radius:999px;font:inherit;font-size:16px;font-weight:600;text-decoration:none;cursor:pointer;border:0;white-space:nowrap}
.btn.primary{background:var(--navy);color:#fff}.btn.primary:hover{background:var(--navy-2)}.btn.teal{background:var(--teal);color:#fff}.btn.teal:hover{background:var(--teal-deep)}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}.btn.ghost.light{color:#fff;border-color:rgba(255,255,255,.6)}.btn.sm{height:44px;padding:0 18px;font-size:15px}.btn.wa{background:var(--wa);color:#fff}
.btn:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.eyebrow{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-deep);font-weight:800;margin-bottom:14px}
h1{font-size:clamp(36px,5.4vw,58px);line-height:1.08;font-weight:800;color:var(--ink);letter-spacing:-.025em;margin:0 0 20px;text-wrap:balance}
h2{font-size:clamp(28px,4vw,40px);line-height:1.12;font-weight:800;color:var(--ink);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
h3{font-size:19px;font-weight:700;color:var(--ink2);margin:0 0 6px}
.lead{font-size:19px;font-weight:300;color:var(--body);margin:0 0 28px;max-width:56ch}
.sec{padding-block:88px 0}.sec.tight{padding-block:56px 0}.center{text-align:center}.center .lead{margin-inline:auto}
.hero{background:var(--mint);padding-block:72px 64px}.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:48px;align-items:center}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr}.hero{padding-block:48px 40px}}
.checks{list-style:none;padding:0;margin:0 0 28px;display:flex;flex-direction:column;gap:10px}.checks li{display:flex;gap:12px;align-items:flex-start;font-size:17px;color:var(--ink2)}
.checks li::before{content:'✓';flex:0 0 26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px;margin-top:2px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.trust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:40px;padding-top:24px;border-top:1px solid rgba(15,42,58,.12)}.trust b{display:block;color:var(--ink);font-size:17px;font-weight:800}.trust span{font-size:13px}
@media (max-width:560px){.trust{grid-template-columns:1fr;gap:10px}}
.photo{position:relative;border-radius:28px;min-height:420px;background:linear-gradient(160deg,#2fb8ab 0%,#137f78 55%,#0f2a3a 100%);overflow:hidden;display:flex;align-items:flex-end;padding:22px}
.photo::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.25),transparent 45%)}
.photo .tag{position:relative;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);color:#fff;border-radius:16px;padding:12px 14px;font-size:13px;max-width:320px}.photo .tag b{display:block;font-size:15px}
.photo .note{position:absolute;top:16px;right:16px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.8);background:rgba(0,0,0,.25);padding:4px 10px;border-radius:999px}
.photo.img{padding:0;min-height:0;background:var(--teal-soft);display:block;aspect-ratio:5/4}.photo.img::before{display:none}.photo.img img{width:100%;height:100%;object-fit:cover;display:block}
.photo.img.contain{background:#fff;border:1px solid var(--line);aspect-ratio:auto;padding:28px}.photo.img.contain img{object-fit:contain;max-height:460px}
.photo .float{position:absolute;left:18px;bottom:18px;background:#fff;color:var(--ink);border-radius:18px;padding:14px 16px;box-shadow:0 14px 40px rgba(15,42,58,.22);max-width:300px}.photo .float b{display:block;font-size:22px;letter-spacing:-.02em}.photo .float b small{font-size:12px;font-weight:600;color:var(--muted);margin-left:6px}.photo .float span{font-size:13px;color:var(--body)}
.step.pic{display:grid;grid-template-columns:116px 1fr;gap:18px;align-items:center}.step.pic img{width:116px;height:96px;object-fit:cover;border-radius:16px;background:var(--mint);grid-row:1/3}.step.pic .n{margin-bottom:8px}@media (max-width:560px){.step.pic{grid-template-columns:1fr}.step.pic img{width:100%;height:150px;grid-row:auto}}
.quote .av{width:56px;height:56px;border-radius:50%;object-fit:cover;display:block;margin-bottom:14px;border:3px solid rgba(255,255,255,.18);background:#fff}.quote .av.logo{border-radius:14px;object-fit:contain;padding:8px;width:96px;height:56px}
.logos img{height:40px;width:auto;max-width:160px;opacity:.85;filter:grayscale(1) contrast(1.05);transition:.2s}.logos img:hover{opacity:1;filter:none}.logos{align-items:center;gap:18px 36px}
.stores{display:flex;gap:12px;margin-top:18px}.stores img{height:42px}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:860px){.grid3,.grid4{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
.tile{display:block;text-decoration:none;color:inherit;background:var(--mint);border:1px solid transparent;border-radius:24px;padding:26px;transition:transform .15s,border-color .15s}.tile:hover{transform:translateY(-3px);border-color:var(--teal)}
.tile h3{font-size:22px;color:var(--ink);margin:6px 0 8px}.tile p{margin:0 0 14px;font-size:15px}.tile .go{color:var(--teal-deep);font-weight:800;font-size:15px}
.step .n{width:44px;height:44px;border-radius:14px;background:var(--navy);color:#fff;font-weight:800;display:grid;place-items:center;margin-bottom:16px;font-size:16px}.step p{margin:0;font-size:15px}
.feat .ic{width:44px;height:44px;border-radius:14px;background:var(--teal-soft);color:var(--teal-deep);display:grid;place-items:center;font-weight:800;font-size:18px;margin-bottom:14px}.feat p{margin:0;font-size:15px}
.logos{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 32px;margin-top:32px}.logos span{font-size:14px;font-weight:800;color:var(--muted);letter-spacing:.02em}.logos span.k{font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:11px}
.dark{background:var(--navy);color:#fff;padding-block:88px}.dark h2,.dark h3{color:#fff}.dark .lead{color:rgba(255,255,255,.8)}.dark .card{background:var(--navy-2);border-color:rgba(255,255,255,.1);color:#fff}
.quote .badge{display:inline-block;background:var(--amber);color:#1b1b1b;font-weight:800;font-size:12px;padding:5px 11px;border-radius:999px;margin-bottom:14px}
.quote .delta{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}.quote .delta small{font-size:13px;font-weight:600;opacity:.75;margin-left:6px}
.quote .who{font-size:13px;opacity:.8;margin-bottom:10px}.quote p{margin:0;font-size:15px;font-style:italic;opacity:.92}
.list2{list-style:none;padding:0;max-width:680px;margin:0 auto}.list2 li{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);font-size:17px;color:var(--ink2)}.list2 li::after{content:'✓';flex:0 0 28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800}
.prog .ic{width:52px;height:52px;border-radius:16px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;margin-bottom:14px}.prog p{margin:0;font-size:15px}.prog .for{font-size:12px;color:var(--teal-deep);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;display:block}
.value{background:var(--mint);padding-block:80px}.value .box{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:40px;align-items:center}@media (max-width:860px){.value .box{grid-template-columns:1fr}}
.mcard{background:linear-gradient(135deg,#2fb8ab,#0f2a3a);color:#fff;border-radius:24px;padding:28px;min-height:230px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 18px 44px rgba(15,42,58,.25)}.mcard .brand{font-weight:800;font-size:24px;letter-spacing:-.02em}.mcard .l{font-size:13px;opacity:.9}.mcard .p{font-size:32px;font-weight:800;line-height:1}.mcard .p small{font-size:14px;font-weight:600;opacity:.9}
h2 s{color:var(--bad);text-decoration:line-through;font-weight:600}
.feats{list-style:none;padding:0;margin:0 0 20px}.feats li{display:flex;gap:10px;align-items:flex-start;font-size:16px;padding:7px 0;color:var(--ink2)}.feats li::before{content:'✓';color:var(--teal);font-weight:800;flex:0 0 18px}
.split{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:40px;align-items:start}@media (max-width:860px){.split{grid-template-columns:1fr}}
.rows{display:flex;flex-direction:column;gap:26px}.rows p{margin:0 0 12px;font-size:15px}
.band{background:var(--navy);color:#fff;padding-block:72px;text-align:center}.band h2{color:#fff}.band p{font-size:18px;font-weight:300;margin:0 auto 26px;max-width:56ch;opacity:.9}
.faq details{border-bottom:1px solid var(--line);padding:14px 0}.faq summary{cursor:pointer;font-weight:700;color:var(--ink2);font-size:16px;list-style:none;display:flex;justify-content:space-between;gap:12px}.faq summary::after{content:'+';color:var(--teal-deep);font-weight:800}.faq details[open] summary::after{content:'–'}.faq details p{margin:10px 0 0;font-size:15px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media (max-width:600px){.form{grid-template-columns:1fr}}.form .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:6px}.f label{font-size:13px;font-weight:700;color:var(--ink2)}.f input,.f select,.f textarea{font:inherit;font-size:16px;padding:13px 16px;border:1.5px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);width:100%;min-width:0}.f small{font-size:12px;color:var(--muted)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin:6px 0 14px}.consent input{margin-top:4px;accent-color:var(--navy);width:16px;height:16px}
.statline{font-size:14px;color:var(--teal-deep);min-height:1.4em;margin-top:8px}
.steps4{counter-reset:s}.steps4 .card{position:relative;padding-left:70px}.steps4 .card::before{counter-increment:s;content:counter(s,decimal-leading-zero);position:absolute;left:24px;top:24px;font-weight:800;color:var(--teal);font-size:16px}
footer{background:var(--sand);padding-block:48px 32px;font-size:14px;color:var(--body);margin-top:88px;border-top:1px solid var(--line)}footer .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}footer b{display:block;color:var(--ink2);font-size:15px;font-weight:700;margin-bottom:8px}footer a{color:var(--body);text-decoration:none;display:block;margin-bottom:5px}footer .small{grid-column:1/-1;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:8px}
.proto{font-size:12px;background:#fff8df;border-bottom:1px solid #f1e3a6;color:#6f5a00;padding:6px 16px;text-align:center}
.wa-float{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--wa);color:#fff;font-weight:700;font-size:15px;height:48px;padding:0 18px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px}.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
.mk{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;background:#fff}.mk .l{font-size:12px;color:var(--muted);font-weight:700}.mk .v{font-size:20px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rb{position:relative;height:16px;margin:6px 0 2px}.rbt{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:5px}.rbt i{display:block;height:100%}.rb b{position:absolute;top:0;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;border:3px solid var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.preview{box-shadow:0 18px 50px rgba(15,42,58,.12)}.preview .pt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-deep);font-weight:800}.preview h3{margin:4px 0 2px;font-size:20px;color:var(--ink)}.preview .sent{font-size:14px;margin:0 0 14px}.preview .sent mark{background:var(--teal-soft);color:var(--navy);font-weight:700;padding:1px 6px;border-radius:6px}.preview .pf{font-size:13px;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.tile{transition:none}}
</style></head><body>
