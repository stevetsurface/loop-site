<!doctype html><html lang="id"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cek Hasil MCU</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: mirrors loophealth.id — white page, lavender hero band, navy pill buttons, 20px-radius hairline cards, centred section titles, grey footer. Light-only by design. Two funnels: individual (upload MCU) and payer (upload claims). */
:root{
  --bg:#ffffff; --hero:#f2f9f8; --foot:#fbfaf8; --ink:#14202b; --ink-2:#2b3a48; --body:#4f5d6a; --muted:#8593a0; --line:#e6ecec;
  --navy:#0f2a3a; --navy-dark:#163b50; --teal:#2fb8ab; --teal-soft:#e3f6f3; --wa:#25d366;
  --ok:#2a9d6f; --ok-soft:#dff3ea; --warn:#d99a00; --warn-soft:#fff3cf; --bad:#d9534f; --bad-soft:#fde3e2;
  --font:'Plus Jakarta Sans',system-ui,sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--body);font-family:var(--font);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:0 0}
.wrap{max-width:1100px;margin:0 auto}
.bleed{margin-inline:-16px;padding-inline:16px}
.nav{height:85px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.nav img{width:87px;height:40px;display:block}
.nav .links{display:flex;gap:22px;align-items:center}
.nav .links a{color:var(--ink-2);text-decoration:none;font-size:16px;font-weight:500}
.nav .links a.on{color:var(--navy);font-weight:600}.nav .links a.btn{color:#fff}
@media (max-width:820px){.nav .links a:not(.btn){display:none}}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:inherit;font-size:13px;font-weight:700;padding:6px 12px;border:0;background:#fff;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--navy);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 24px;border-radius:26px;font:inherit;font-size:16px;font-weight:500;text-decoration:none;cursor:pointer;border:0;white-space:nowrap}
.btn.primary{background:var(--navy);color:#fff}.btn.primary:hover{background:var(--navy-dark)}
.btn.secondary{background:#fff;color:var(--navy);border:1.5px solid var(--navy);font-weight:600}
.btn.wa{background:var(--wa);color:#fff;font-weight:600}
.btn.sm{height:44px;padding:0 18px;font-size:15px}
.btn:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible,label.drop:focus-within{outline:2px solid var(--teal);outline-offset:2px}
.hero{background:var(--hero);padding-block:64px 56px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr}.hero{padding-block:44px 40px}}
h1{font-size:clamp(34px,5vw,48px);line-height:1.35;font-weight:800;color:var(--ink);margin:0 0 16px;text-wrap:balance}
.hero p.sub{font-size:20px;font-weight:300;line-height:1.7;color:var(--body);margin:0 0 26px;max-width:52ch}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px}
.preview{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px 22px 18px;box-shadow:0 10px 30px rgba(49,62,114,.08)}
.preview .pt{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.preview h3{margin:4px 0 12px;font-size:20px;font-weight:700;color:var(--ink-2)}
.preview .rows{display:flex;flex-direction:column;gap:8px}
.preview .r{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;font-size:14px;padding:8px 10px;border-radius:12px;background:var(--hero)}
.preview .r b{color:var(--ink-2);font-weight:600}
.preview .r .n{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;vertical-align:middle}
.chip.ok::before,.chip.warn::before,.chip.bad::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
.mk .v{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.mk .x{font-size:12px;color:var(--body);margin-top:6px;line-height:1.45}
.rb{position:relative;height:18px;margin:8px 0 4px}.rbt{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:6px}.rbt i{display:block;height:100%}.rb b{position:absolute;top:1px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;border:3px solid var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.verdict .cnt{margin-top:6px;font-size:13px;font-weight:700;opacity:.95}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.navy{background:var(--hero);color:var(--navy)}
.preview .pf{margin-top:12px;font-size:13px;color:var(--body);border-top:1px solid var(--line);padding-top:10px}
section.sec{padding-block:64px 24px}
h2.center{text-align:center;font-size:clamp(26px,4vw,32px);font-weight:800;color:var(--ink);margin:0 0 32px;text-wrap:balance}
p.center{text-align:center;font-size:17px;font-weight:300;margin:-20px auto 28px;max-width:64ch}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:760px){.three{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px}
.card h3{font-size:20px;font-weight:700;color:var(--ink-2);margin:0 0 6px}
.card p{font-size:14px;line-height:1.6;margin:0}
.tile{width:56px;height:56px;border-radius:16px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-weight:800;font-size:20px;margin-bottom:14px}
.tool{max-width:860px;margin:0 auto}
label.drop{display:block;border:2px dashed var(--teal);border-radius:24px;padding:34px 20px;text-align:center;background:var(--teal-soft);cursor:pointer}
label.drop.drag{background:#d6f1ee}
label.drop strong{display:block;font-size:18px;color:var(--ink-2);margin-bottom:6px}
label.drop span{font-size:14px;color:var(--body)}
label.drop input{display:none}
.status{font-size:14px;color:var(--navy);min-height:1.4em;margin-top:10px;white-space:pre-wrap}
.status.err{color:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.readvals{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.readvals span{font-size:12px;background:var(--hero);color:var(--navy);padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.verdict{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;border-radius:20px;padding:20px;color:#fff;margin-bottom:16px}
.verdict .dot{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:26px}
.verdict h2{margin:0;font-size:22px;font-weight:800;color:#fff}
.verdict p{margin:4px 0 0;font-size:15px;opacity:.95}
.markers{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:4px}
.mk{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:#fff;min-width:0}
.mk .l{font-size:12.5px;color:var(--muted);font-weight:600}
.mk .v{font-size:22px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.mk .n{font-size:12px;color:var(--body);margin-bottom:6px}
.alert{border-left:4px solid var(--bad);background:var(--bad-soft);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:15px;color:var(--ink-2)}
.alert b{color:var(--bad)}
h3.sub{font-size:20px;font-weight:700;color:var(--ink-2);margin:22px 0 10px}
.progs{display:flex;flex-direction:column;gap:12px}
.prog{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;border:1px solid var(--line);border-radius:20px;padding:16px 18px;background:#fff}
.prog .ic{width:48px;height:48px;border-radius:14px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.prog b{display:block;font-size:17px;color:var(--ink-2)}
.prog p{margin:3px 0 0;font-size:14px;line-height:1.6}
.explain{font-size:14.5px;color:var(--body);margin:12px 0 0;padding-left:18px}
.explain li{margin-bottom:4px}
p.note{font-size:14.5px;color:var(--body);margin:12px 0 0}
/* payer */
.payer{background:var(--hero);padding-block:64px 56px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:0 0 16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .s{font-size:12.5px;color:var(--body)}
.bar{display:flex;height:30px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff}
.bar div{display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;min-width:0;overflow:hidden;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--body);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:620px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--hero)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px}
.map label{font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.map select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid #dcdcdc;border-radius:12px;background:#fff;color:var(--ink)}
.toggle{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--body);margin-top:10px}
.toggle input{accent-color:var(--navy);width:16px;height:16px}
.leadband{background:var(--hero);padding-block:56px}
.leadband .wrap{max-width:860px}
.leadband h2{text-align:center;font-size:clamp(24px,4vw,32px);font-weight:800;color:var(--ink);margin:0 0 8px}
.leadband p.c{text-align:center;font-size:17px;font-weight:300;margin:0 0 24px}
.lead-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.lead-form{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:13px;color:var(--ink-2);font-weight:600}
.f input{font:inherit;font-size:16px;padding:11px 14px;border:1px solid #dcdcdc;border-radius:14px;background:#fff;color:var(--ink);width:100%;min-width:0}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--body);margin-top:12px}
.consent input{margin-top:4px;accent-color:var(--navy);width:16px;height:16px}
.trust{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;font-size:13px;color:var(--body);margin-top:18px}
footer{background:var(--foot);padding-block:40px 32px;font-size:14px;color:var(--body)}
footer .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
footer b{display:block;color:var(--ink-2);font-size:16px;font-weight:500;margin-bottom:8px}
footer a{color:var(--body);text-decoration:none;display:block;margin-bottom:4px}
footer .small{grid-column:1/-1;font-size:12px;color:var(--muted);border-top:1px solid #e3e3e3;padding-top:14px;margin-top:8px}
.proto{font-size:12px;background:#fffbe6;border-bottom:1px solid #f0e6b0;color:#7a6a1f;padding:6px 16px;text-align:center}
.wa-float{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--wa);color:#fff;font-weight:600;font-size:15px;height:48px;padding:0 18px;border-radius:24px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

<style>
/* additions: free upload, member table, report */
.ways{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
@media (max-width:700px){.ways{grid-template-columns:1fr}}
.way{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;font-size:13px;color:var(--body)}
.way b{display:block;color:var(--ink-2);font-size:14px}
.notdx{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--hero);color:var(--ink-2);font-size:14px;line-height:1.55}
.notdx b{color:var(--navy)}
label.drop.big{padding:40px 20px}
label.drop strong.l{font-size:20px}
.tiers{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.member td .chip{font-size:11px}
.reportview{border:1px solid var(--line);border-radius:20px;background:#fff;padding:0;overflow:hidden;margin-top:16px}
.reportview iframe{width:100%;height:70vh;border:0;background:#fff}
.lead-form.four{grid-template-columns:1fr 1fr}
.req{color:var(--bad)}
</style>

function readSheet(file){ return new Promise((res,rej)=>{ const rd=new FileReader(); rd.onerror=()=>rej(new Error('read')); rd.onload=()=>{ try{ if(/\.csv$/i.test(file.name)||file.type==='text/csv'){ res(String(rd.result)); return; } const wb=XLSX.read(rd.result,{type:'array'}); res(XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]])); }catch(e){ rej(e); } }; if(/\.csv$/i.test(file.name)||file.type==='text/csv') rd.readAsText(file); else rd.readAsArrayBuffer(file); }); }
function parseCSV(text){ const rows=[]; let row=[],cell='',q=false; for(let i=0;i<text.length;i++){ const c=text[i]; if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; } else { if(c==='"') q=true; else if(c===','||c===';'||c==='\t'){row.push(cell);cell='';} else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; } else cell+=c; } } if(cell!==''||row.length){row.push(cell);rows.push(row);} return rows.filter(r=>r.some(x=>String(x).trim()!=='')); }
